# Starts the GitHub Actions workflow frequent-email-sync.yml on main.
#
# GitHub's own cron for that workflow fires rarely (once in many hours), so
# Cloud Scheduler calls this workflow every 15 minutes instead. The GitHub
# token lives only in Secret Manager: this file and the Scheduler job hold no
# secret, and the workflow returns nothing, so the token never reaches the
# execution result. Setup: infra/gcloud/setup-sync-dispatcher.sh
main:
  steps:
    - read_token:
        call: googleapis.secretmanager.v1.projects.secrets.versions.accessString
        args:
          secret_id: github-sync-dispatch-token
          project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
        result: token
    - dispatch:
        # GitHub answers 204 with no body. Any status >= 400 raises and fails
        # the execution, which shows in the Workflows console.
        call: http.post
        args:
          url: https://api.github.com/repos/ThonyFD/personal-dashboard/actions/workflows/frequent-email-sync.yml/dispatches
          timeout: 30
          headers:
            Authorization: ${"Bearer " + token}
            Accept: application/vnd.github+json
            X-GitHub-Api-Version: "2022-11-28"
            User-Agent: personal-dashboard-sync-dispatcher
          body:
            ref: main
